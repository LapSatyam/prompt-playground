<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Playground</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen">
    <main class="max-w-6xl mx-auto px-6 py-12">

        <header class="mb-10">
            <h1 class="text-4xl font-semibold tracking-tight ">
                Prompt Playground
            </h1>
            <p class="text-zinc-500 mt-2">
                Write, save and organize your prompts.
            </p>
        </header>

        <section class="grid md:grid-cols-2 gap-8">

            <!-- left -->
             <div class="bg-white rounded-3xl shadow-sm border border-zinc-200 p-6">
                <div class="flex gap-2 mb-4">
                    <button class="px-4 py-2 rounded-full bg-zinc-900 text-white text-sm">
                        Code
                    </button>
                    <button class="px-4 py-2 rofu' bg-zinc-100 text-sm">
                        Writing
                    </button>
                    <button class="px-4 py-2 rounded-full bg-zinc-100 text-sm">
                        Study
                    </button>
                </div>

             <textarea id="promptInput" class="w-full h-56 resize-none rounded-2xl border border-zinc-200 p-4 outline-none focus:ring-2 focus:ring-zinc-300"
             placeholder="Write your prompt..."></textarea>

             <div class="flex justify-between items-center mt-4">
                <p id="charCount" class="text-sm text-zinc-500">0 characters</p>

                <button id="saveBtn" class="px-5 py-2 rounded-full bg-zinc-900 text-white">Save Prompt</button>
             </div>
            </div>

            <!-- right -->
             <div class="bg-white rounded-3xl shadow-sm border border-zinc-200 p-6">
                <h2 class="text-xl font-medium mb-4">Saved Prompts</h2>

                <div id="promptList" class="space-y-3">
                    <!-- cards here -->
                </div>

             </div>
             
        </section>
    </main>

<script src="app.js"></script>
</body>
</html>
